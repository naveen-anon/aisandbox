name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No gradlew wrapper jar is committed (binary jar in a security-tooling
      # repo is something you want to audit, not trust blindly) — setup-gradle
      # provisions a pinned, verified Gradle instead.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-sandbox-trainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
